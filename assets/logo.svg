    <use href="#groove" stroke="#F2F4F7" transform="translate(236 168) rotate(22) scale(1.05)"/>
    <use href="#groove" stroke="#F2F4F7" transform="translate(190 222) rotate(98) scale(1.1)"/>
  </g>
  <text x="200" y="330" text-anchor="middle" font-family="'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif" font-size="56" letter-spacing="10" fill="#0D1B2A">tsubu</text>
  <path d="M146 352 H254" stroke="#1565FF" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 11" fill="none"/>
