    <use href="#grain" fill="#1565FF" transform="translate(236 168) rotate(22) scale(1.05)"/>
    <use href="#grain" fill="#0D1B2A" transform="translate(190 222) rotate(98) scale(1.1)"/>
  </g>
  <g opacity=".55">
